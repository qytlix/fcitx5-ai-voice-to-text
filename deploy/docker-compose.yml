version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - PYTHONIOENCODING=utf-8
      - ASR_PROVIDER=xunfei
      - LLM_PROVIDER=mock
      - MAX_AUDIO_MB=10
      - REQUEST_TIMEOUT_SECONDS=30
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./server/data:/app/server/data
